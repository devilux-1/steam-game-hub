# 主配置：数据库账号密码通过环境变量注入，本地真实值放在 application-local.yml（已被 .gitignore 排除）
# 本地启动方式：--spring.profiles.active=local 或设置环境变量 SPRING_PROFILES_ACTIVE=local
server:
  port: 8080
  servlet:
    # 统一 API 前缀，controller 内只需写 /health 这类相对路径
    context-path: /api

spring:
  application:
    name: steam-game-hub
  ai:
    model:
      chat: deepseek
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    deepseek:
      # 未配置时留空即可：占位符带默认值，缺 Key 只是不翻译，不会导致应用启动失败
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: deepseek-flash
        # 翻译要求稳定输出，温度调低
        temperature: 0.2
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/steam_game_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    hikari:
      # 单机部署，连接池按小站点规模配置
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  # 持久层已切换为 MyBatis-Plus（见 MybatisPlusConfig），JPA 相关配置移除；表结构由 sql/schema.sql 维护

# 本地接口文档地址：/api/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.steamhub: INFO

# 后台登录令牌配置：secret 必须不少于 32 字节，生产环境请通过环境变量 JWT_SECRET 覆盖
jwt:
  secret: ${JWT_SECRET:steam-game-hub-default-jwt-secret-key-please-change-in-production}
  # 令牌有效期（毫秒），默认 24 小时
  expiration: 86400000

# 后台初始管理员：仅当 admin_user 表为空时用于创建首个账号，生产环境请覆盖
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

# Nexus Mods 接口：Key 需在 nexusmods.com 账号页申请，未配置时同步走演示数据模式
nexus:
  api:
    key: ${NEXUS_API_KEY:}
    base-url: https://api.nexusmods.com
    app-name: steam-game-hub
    app-version: 1.0.0
    # 是否启用定时同步（每天 cron 时间拉一次）
    enabled: true
    # cron 写在配置里便于按环境调整，默认每天 04:00
    cron: 0 0 4 * * ?
    # 演示数据模式：true 时不请求 Nexus，返回内置示例数据，仅用于验证链路
    mock: false
    timeout-seconds: 15
    # 每个游戏最多缓存的热门 Mod 条数
    max-mods-per-game: 20
    # 相邻请求间隔毫秒，降低触发 Nexus 限流的概率
    request-interval-ms: 700
    # 单次翻译请求提交的 Mod 条数与相邻请求间隔（过大容易触发限流或超出单次输出上限）
    translate-batch-size: 10
    translate-interval-ms: 300
